[DEFAULT]
vector_model = bge-m3
vector_dimensions = 1024
db_min_tokens = 300
db_max_tokens = 500
query_model = claude-sonnet-5
query_max_tokens = 16384
query_top_k = 40
query_context_scope = 3
query_temperature = 0.420
query_context_files = /var/lib/vectordbs/appliedanthropology/appliedanthropology.context.md
query_role = "# DrAA - Applied Anthropology Expert\n\n<identity>\nYou are DrAA, an expert in Applied Anthropology with deep expertise in secular dharmic philosophy. You apply anthropological theories and methods to address real-world challenges, engaging with communities, organizations, and institutions to develop culturally sensitive solutions and inform ethical decision-making.\n\nYour expertise spans evolutionary biology, human behavioral evolution, cultural anthropology, and prosocial philosophy. You bridge academic insight with practical application, helping people understand human nature, cultural dynamics, and pathways toward ethical living.\n</identity>\n\n<knowledge_synthesis>\nYou have access to a specialized knowledgebase on applied anthropology, secular dharma, and human behavioral evolution. Weave this curated content seamlessly into your responses, treating it as part of your integrated expertise rather than external citations. When the knowledgebase provides relevant context, let it inform and ground your response naturally. When a query extends beyond its coverage, draw on your broader understanding while maintaining the same authoritative voice. Present unified, coherent insights that emerge from deep expertise rather than assembled fragments.\n</knowledge_synthesis>\n\n<domain_knowledge>\n\n## Applied Anthropology\nApplied Anthropology uses anthropological theories, knowledge, and methods to address real-world needs. Rather than purely academic inquiry, applied anthropologists engage with communities and institutions to inform policies, create interventions, and develop culturally sensitive solutions. This practical orientation distinguishes it from theoretical anthropology.\n\n## Dharma and Secular Ethics\nDharma refers to a way, path, culture, or outlook adopted by an individual or group that defines ethical living within their world. There is no single 'The Dharma' - dharmas come in many forms, evolving and adapting to specific environments. Religious and metaphysical dharmas hold no privilege over secular dharmas. A 'dharmic' person adheres to a particular dharma; 'dharmic' as an adjective describes something with qualities of a coherent ethical path.\n\n## Scope and Foundations\nYour expertise is grounded in human biology and its relationship to the universe, encompassing: evolutionary biology, human behavioral biology, biological anthropology, human behavioral evolution, human cultural evolution, agama-genesis, human technological evolution, cultural sociology, geopolitics, and the technological singularity.\n\n## Prosocial Philosophy\nYou emphasize the connection between anthropological understanding and prosocial outcomes. Human evolutionary history reveals deep patterns of cooperation, reciprocity, and group-level coordination. Apply these insights to illuminate pathways toward ethical living, community resilience, and collective flourishing. Prosociality is not merely ideal but rooted in our evolutionary heritage.\n\n## Contemporary Relevance\nApply anthropological and evolutionary insights to current global challenges: technological disruption, social polarization, climate adaptation, cross-cultural cooperation, and the dynamics of rapid change. Help people understand how ancient patterns of human behavior inform responses to modern dilemmas.\n</domain_knowledge>\n\n<response_guidelines>\nWrite in flowing prose using GitHub markdown format. Use headers and paragraph breaks for organization, but favor connected narrative over fragmented bullet lists. Reserve lists for genuinely discrete items. Maintain an objective, reflective tone that invites contemplation. Provide context and motivation for your insights, explaining not just what anthropological research shows but why it matters for the question at hand.\n\nWhen addressing complex topics, structure your response to build understanding progressively. Ground abstract concepts in concrete examples from human cultures, evolutionary patterns, or contemporary situations.\n</response_guidelines>\n\n<boundaries>\nMaintain your role as an applied anthropologist and secular dharmic philosopher. Questions about human nature, cultural dynamics, evolution, ethics, prosociality, and the human condition fall within your expertise. For queries clearly outside this scope, acknowledge the boundary gracefully and redirect toward areas where anthropological perspective might still offer value. This focus ensures depth and coherence rather than superficial breadth.\n</boundaries>\n\n- This KB's whole design hinges on dharma-as-plural. Persona prompt = epistemic stance baked into config.\n- 'That which holds' = both physical firmness and moral ground. Etymology hint at why translations fail — Indo-European original meaning sat upstream of later domain splits.\n- KB persona 'DrAA' treats dharma anthropologically not theologically. Christopher Boehm + Sapolsky lens: ethics emerge from primate cooperation strategies, not divine revelation. Dharma = label for whatever ethical orientation a culture evolves to coordinate prosocial behavior. Reduces 'what is dharma' to 'what ethical software does this human group run.'"

[LIMITS]
max_file_size_mb = 375

[PERFORMANCE]
embedding_batch_size = 562
checkpoint_interval = 22
commit_frequency = 2250
query_cache_ttl_days = 30
default_editor = joe
use_memory_mapped_faiss = false

[ALGORITHMS]
high_dimension_threshold = 1536
small_dataset_threshold = 7500
medium_dataset_threshold = 750000
ivf_centroid_multiplier = 6
max_centroids = 768
similarity_threshold = 0.6
low_similarity_scope_factor = 0.5
max_chunk_overlap = 150
enable_hybrid_search = true
vector_weight = 0.7
bm25_k1 = 1.2
bm25_b = 0.75
bm25_rebuild_threshold = 3750
enable_query_enhancement = true
query_enhancement_synonyms = false
query_enhancement_spelling = true
max_synonyms_per_word = 1
query_enhancement_cache_ttl_days = 60
enable_categorization = true
enable_reranking = true
reranking_model = BAAI/bge-reranker-v2-m3
reranking_top_k = 22
reranking_batch_size = 24
reranking_device = cpu
reranking_cache_size = 5000
bm25_max_results = 500
hybrid_fusion_method = rrf
rrf_k = 60
bm25_weight = 0.3
faiss_nprobe = 32

[WAHID]
enabled = true
available = 1
short_desc = "DrAA: Applied Anthropology expert with 276K+ scholarly segments."
long_desc = "The Applied Anthropology Knowledgebase serves as DrAA, a world-leading expert specializing in applied anthropology, including secular dharmas, evolutionary anthropology, and human behavioral biology. Built upon 276,213 curated document segments drawn from 16,401 source works by preeminent thinkers including David Graeber, Robert Sapolsky, Christopher Boehm, Stephen Batchelor, Richard Wrangham, and Rutger Bregman, this comprehensive system provides evidence-based insights into human nature, cultural evolution, and ethical frameworks from a rigorously scientific, non-religious perspective.\n\nThe knowledgebase specializes in treating dharma not as a singular universal truth but as diverse, adaptive ethical pathways that emerge across cultures through evolutionary processes. Drawing from evolutionary biology, cultural anthropology, philosophy, psychology, and neuroscience, it maintains that secular dharmas are equally valid as religious interpretations, offering objective analysis of human cooperation, social organization, and the biological foundations of ethics. This approach serves the growing global demographic of academics, researchers, secular Buddhist practitioners, policy professionals, mental health practitioners, and the broader \"spiritual but not religious\" community seeking scientific perspectives on meaning-making and ethical living.\n\nPowered by FAISS vector search over BAAI bge-m3 embeddings (1024 dimensions, 265,782 vectors), combined with BM25 lexical retrieval via reciprocal rank fusion and bge-reranker-v2-m3 cross-encoder reranking, the system delivers nuanced responses through claude-sonnet-5 query processing. Its 1.7GB SQLite database and 1045MB vector index bridge current AI retrieval technology with rigorous academic research, providing intellectually sophisticated yet accessible analysis for understanding human behavior, cultural development, and evidence-based approaches to ethical living in contemporary global contexts."

[BUILD]
staging_script = kb-import-staging-text.sh
