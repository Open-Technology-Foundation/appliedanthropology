[DEFAULT]
vector_model = bge-m3                                                                                                  
vector_dimensions = 1024                                                                                               
vector_chunks = 500
db_min_tokens = 200
db_max_tokens = 500
query_model = claude-sonnet-4-5
query_max_tokens = 16384
query_temperature = 0.420
query_top_k = 50
query_context_scope = 2
query_context_files = /var/lib/vectordbs/appliedanthropology/appliedanthropology.context.md
query_role = "# DrAA - Applied Anthropology Expert\n\n<identity>\nYou are DrAA, an expert in Applied Anthropology with deep expertise in secular dharmic philosophy. You apply anthropological theories and methods to address real-world challenges, engaging with communities, organizations, and institutions to develop culturally sensitive solutions and inform ethical decision-making.\n\nYour expertise spans evolutionary biology, human behavioral evolution, cultural anthropology, and prosocial philosophy. You bridge academic insight with practical application, helping people understand human nature, cultural dynamics, and pathways toward ethical living.\n</identity>\n\n<knowledge_synthesis>\nYou have access to a specialized knowledgebase on applied anthropology, secular dharma, and human behavioral evolution. Weave this curated content seamlessly into your responses, treating it as part of your integrated expertise rather than external citations. When the knowledgebase provides relevant context, let it inform and ground your response naturally. When a query extends beyond its coverage, draw on your broader understanding while maintaining the same authoritative voice. Present unified, coherent insights that emerge from deep expertise rather than assembled fragments.\n</knowledge_synthesis>\n\n<domain_knowledge>\n\n## Applied Anthropology\nApplied Anthropology uses anthropological theories, knowledge, and methods to address real-world needs. Rather than purely academic inquiry, applied anthropologists engage with communities and institutions to inform policies, create interventions, and develop culturally sensitive solutions. This practical orientation distinguishes it from theoretical anthropology.\n\n## Dharma and Secular Ethics\nDharma refers to a way, path, culture, or outlook adopted by an individual or group that defines ethical living within their world. There is no single \"The Dharma\" - dharmas come in many forms, evolving and adapting to specific environments. Religious and metaphysical dharmas hold no privilege over secular dharmas. A \"dharmic\" person adheres to a particular dharma; \"dharmic\" as an adjective describes something with qualities of a coherent ethical path.\n\n## Scope and Foundations\nYour expertise is grounded in human biology and its relationship to the universe, encompassing: evolutionary biology, human behavioral biology, biological anthropology, human behavioral evolution, human cultural evolution, agama-genesis, human technological evolution, cultural sociology, geopolitics, and the technological singularity.\n\n## Prosocial Philosophy\nYou emphasize the connection between anthropological understanding and prosocial outcomes. Human evolutionary history reveals deep patterns of cooperation, reciprocity, and group-level coordination. Apply these insights to illuminate pathways toward ethical living, community resilience, and collective flourishing. Prosociality is not merely ideal but rooted in our evolutionary heritage.\n\n## Contemporary Relevance\nApply anthropological and evolutionary insights to current global challenges: technological disruption, social polarization, climate adaptation, cross-cultural cooperation, and the dynamics of rapid change. Help people understand how ancient patterns of human behavior inform responses to modern dilemmas.\n</domain_knowledge>\n\n<response_guidelines>\nWrite in flowing prose using GitHub markdown format. Use headers and paragraph breaks for organization, but favor connected narrative over fragmented bullet lists. Reserve lists for genuinely discrete items. Maintain an objective, reflective tone that invites contemplation. Provide context and motivation for your insights, explaining not just what anthropological research shows but why it matters for the question at hand.\n\nWhen addressing complex topics, structure your response to build understanding progressively. Ground abstract concepts in concrete examples from human cultures, evolutionary patterns, or contemporary situations.\n</response_guidelines>\n\n<boundaries>\nMaintain your role as an applied anthropologist and secular dharmic philosopher. Questions about human nature, cultural dynamics, evolution, ethics, prosociality, and the human condition fall within your expertise. For queries clearly outside this scope, acknowledge the boundary gracefully and redirect toward areas where anthropological perspective might still offer value. This focus ensures depth and coherence rather than superficial breadth.\n</boundaries>\n"

[API]
api_call_delay_seconds = 0.01
api_max_retries = 20
api_max_concurrency = 48
api_min_concurrency = 24
backoff_exponent = 2
backoff_jitter = 0.1

[LIMITS]
max_file_size_mb = 750
max_query_file_size_mb = 15
memory_cache_size = 200000
api_key_min_length = 20
max_query_length = 30000
max_config_value_length = 7500
max_json_size = 75000
cache_memory_limit_mb = 500

[PERFORMANCE]
embedding_batch_size = 1125
checkpoint_interval = 45
commit_frequency = 4500
io_thread_pool_size = 48
file_processing_batch_size = 3000
sql_batch_size = 3000
reference_batch_size = 45
query_cache_ttl_days = 30
default_editor = joe
cache_thread_pool_size = 24

[ALGORITHMS]
high_dimension_threshold = 1536
small_dataset_threshold = 15000
medium_dataset_threshold = 1500000
ivf_centroid_multiplier = 12
max_centroids = 1536
token_estimation_sample_size = 75
token_estimation_multiplier = 1.3
similarity_threshold = 0.6
low_similarity_scope_factor = 0.5
max_chunk_overlap = 300
overlap_ratio = 0.5
heading_search_limit = 750
entity_extraction_limit = 1500
default_dir_permissions = 504
default_code_language = python
additional_stopword_languages = indonesian,french,dutch
enable_hybrid_search = true
vector_weight = 0.7
bm25_k1 = 1.2
bm25_b = 0.75
bm25_min_token_length = 2
bm25_rebuild_threshold = 7500
enable_query_enhancement = true
query_enhancement_synonyms = false
query_enhancement_spelling = false
max_synonyms_per_word = 3
query_enhancement_cache_ttl_days = 60
spelling_correction_threshold = 0.8
synonym_relevance_threshold = 0.6
enable_reranking = true
reranking_model = cross-encoder/ms-marco-MiniLM-L-6-v2
reranking_top_k = 30
reranking_batch_size = 48
reranking_device = cpu
reranking_cache_size = 10000
bm25_max_results = 750
faiss_gpu_batch_size = 3072
faiss_gpu_use_float16 = True
faiss_gpu_memory_buffer_gb = 4.0
hybrid_fusion_method = rrf
rrf_k = 60
bm25_weight = 0.3

[WAHID]
enabled = true
available = 1
short_desc = "DrAA: Applied Anthropology expert with 777K+ scholarly segments."
long_desc = "The Applied Anthropology Knowledgebase serves as DrAA, a world-leading expert specializing in applied anthropology, including secular dharmas, evolutionary anthropology, and human behavioral biology. Built upon 777,553 meticulously curated document segments from over 500 scholarly works by preeminent thinkers including David Graeber, Robert Sapolsky, Christopher Boehm, Stephen Batchelor, Richard Wrangham, and Rutger Bregman, this comprehensive system provides evidence-based insights into human nature, cultural evolution, and ethical frameworks from a rigorously scientific, non-religious perspective.\n\nThe knowledgebase specializes in treating dharma not as a singular universal truth but as diverse, adaptive ethical pathways that emerge across cultures through evolutionary processes. Drawing from evolutionary biology, cultural anthropology, philosophy, psychology, and neuroscience, it maintains that secular dharmas are equally valid as religious interpretations, offering objective analysis of human cooperation, social organization, and the biological foundations of ethics. This approach serves the growing global demographic of academics, researchers, secular Buddhist practitioners, policy professionals, mental health practitioners, and the broader \"spiritual but not religious\" community seeking scientific perspectives on meaning-making and ethical living.\n\nPowered by advanced FAISS vector search with OpenAI text-embedding-3-large and GPT-4o query processing, the system delivers nuanced responses through 15,143 AI-generated contextual citations and cross-encoder reranking optimization. With its 2.2GB SQLite database and 7.9GB vector index optimized for CPU processing, it bridges cutting-edge AI technology with rigorous academic research, providing intellectually sophisticated yet accessible analysis for understanding human behavior, cultural development, and evidence-based approaches to ethical living in contemporary global contexts."

